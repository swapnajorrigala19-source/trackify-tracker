{% extends "base.html" %}
{% block title %}Manage Categories - Trackify{% endblock %}
{% block content %}
<div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
    <h2>Manage Categories</h2>
</div>

<div style="display: grid; grid-template-columns: 1fr 2fr; gap: 2rem;">
    <div class="card">
        <h3>Add New Category</h3>
        <form method="POST" action="{{ url_for('manage_categories') }}" style="margin-top: 1rem;">
            <div class="form-group">
                <label>Category Name</label>
                <input type="text" name="name" class="form-control" required>
            </div>
            <button class="btn btn-primary" type="submit" style="width: 100%;"><i class="fas fa-plus"></i> Add
                Category</button>
        </form>
    </div>

    <div class="card">
        <h3>Existing Categories</h3>
        <ul style="list-style: none; margin-top: 1rem; padding: 0;">
            {% for category in categories %}
            <li
                style="padding: 1rem; border-bottom: 1px solid var(--border-color); background: rgba(255,255,255,0.05); border-radius: 8px; margin-bottom: 0.5rem; display: flex; justify-content: space-between; align-items: center;">
                <span>{{ category.name }}</span>
                <span class="badge badge-success">Active</span>
            </li>
            {% endfor %}
        </ul>
    </div>
</div>
{% endblock %}
