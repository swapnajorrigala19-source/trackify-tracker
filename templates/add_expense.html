{% extends "base.html" %}
{% block title %}Add Expense - Trackify{% endblock %}
{% block content %}
<div class="card" style="max-width: 600px; margin: 2rem auto;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
        <h2>Add New Expense</h2>
        <a href="{{ url_for('dashboard') }}" class="btn btn-outline"><i class="fas fa-arrow-left"></i> Back</a>
    </div>

    <form method="POST" action="{{ url_for('add_expense') }}">
        <div class="form-group">
            <label for="amount">Amount (₹)</label>
            <input type="number" step="0.01" name="amount" id="amount" class="form-control" required>
        </div>
        <div class="form-group">
            <label for="category">Category</label>
            <select name="category" id="category" class="form-control">
                <option value="" disabled selected>Select a category</option>
                {% for category in categories %}
                <option value="{{ category.id }}">{{ category.name }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group" style="margin-top: -1rem; margin-bottom: 1.5rem;">
            <p style="text-align: center; color: var(--text-muted); font-size: 0.9rem; margin-bottom: 0.5rem;">— OR —
            </p>
            <input type="text" name="new_category" id="new_category" class="form-control"
                placeholder="Create a new custom category...">
        </div>
        <div class="form-group">
            <label for="date">Date</label>
            <input type="date" name="date" id="date" class="form-control" value="{{ today_date }}" required>
        </div>
        <div class="form-group">
            <label for="description">Description (Optional)</label>
            <textarea name="description" id="description" class="form-control" rows="3"></textarea>
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%;"><i class="fas fa-save"></i> Save
            Expense</button>
    </form>
</div>

<script>
    document.querySelector('form').addEventListener('submit', function (e) {
        var catSelect = document.getElementById('category').value;
        var newCat = document.getElementById('new_category').value.trim();
        if (!catSelect && !newCat) {
            e.preventDefault();
            alert('Please select an existing category or type a name to create a new custom category.');
        }
    });
</script>
{% endblock %}
