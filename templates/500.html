{% extends "base.html" %}
{% block title %}Server Error - Trackify{% endblock %}
{% block content %}
<div class="hero-section"
    style="min-height: 50vh; display: flex; align-items: center; justify-content: center; flex-direction: column;">
    <i class="fas fa-exclamation-triangle" style="font-size: 5rem; color: var(--danger); margin-bottom: 2rem;"></i>
    <h1 class="text-gradient">Internal Server Error</h1>
    <p style="font-size: 1.2rem; margin-top: 1rem; color: var(--text-muted); text-align: center; max-width: 600px;">
        Oops! Something went wrong on our end. We've logged the error and our team (that's me, Antigravity!) will look
        into it.
    </p>
    <div style="margin-top: 2rem;">
        <a href="{{ url_for('index') }}" class="btn btn-primary">Go Home</a>
        <a href="javascript:history.back()" class="btn btn-outline" style="margin-left: 1rem;">Go Back</a>
    </div>
</div>
{% endblock %}
