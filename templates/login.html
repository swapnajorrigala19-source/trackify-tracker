{% extends "base.html" %}
{% block title %}Login - Trackify{% endblock %}
{% block content %}
<div class="auth-card" style="max-width: 400px; margin: 4rem auto;">
    <h2>Welcome Back</h2>
    <form method="POST" action="{{ url_for('login') }}">
        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" name="email" id="email" class="form-control" required>
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" name="password" id="password" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%;">Login</button>
    </form>
    <p style="margin-top: 1rem; text-align: center;">Don't have an account? <a href="{{ url_for('register') }}">Sign
            Up</a></p>
    <p style="margin-top: 0.5rem; text-align: center;"><a href="{{ url_for('admin_login') }}">Admin Login</a></p>
</div>
{% endblock %}
