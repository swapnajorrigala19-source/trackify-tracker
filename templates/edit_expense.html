{% extends "base.html" %}
{% block title %}Edit Expense - Trackify{% endblock %}
{% block content %}
<div class="card" style="max-width: 600px; margin: 2rem auto;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
        <h2>Edit Expense</h2>
        <a href="{{ url_for('expenses') }}" class="btn btn-outline"><i class="fas fa-arrow-left"></i> Back</a>
    </div>

    <form method="POST" action="{{ url_for('edit_expense', expense_id=expense.id) }}">
        <div class="form-group">
            <label for="amount">Amount (₹)</label>
            <input type="number" step="0.01" name="amount" id="amount" class="form-control" value="{{ expense.amount }}"
                required>
        </div>
        <div class="form-group">
            <label for="category">Category</label>
            <select name="category" id="category" class="form-control" required>
                {% for category in categories %}
                <option value="{{ category.id }}" {% if category.id==expense.category_id %}selected{% endif %}>{{
                    category.name }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label for="date">Date</label>
            <input type="date" name="date" id="date" class="form-control"
                value="{{ expense.date.strftime('%Y-%m-%d') }}" required>
        </div>
        <div class="form-group">
            <label for="description">Description</label>
            <textarea name="description" id="description" class="form-control"
                rows="3">{{ expense.description }}</textarea>
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%;"><i class="fas fa-save"></i> Update
            Expense</button>
    </form>
</div>
{% endblock %}
