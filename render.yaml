services:
  - type: web
    name: trackify-website
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn website:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: trackify-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: FLASK_ENV
        value: production

databases:
  - name: trackify-db
    plan: free
